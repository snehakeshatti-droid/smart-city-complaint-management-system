
spring.application.name=complaint-system

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/city_complaints
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# MongoDB Database
spring.mongodb.uri=mongodb://localhost:27017/city_complaints_mongo
