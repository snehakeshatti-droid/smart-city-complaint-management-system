
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Complaint Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #0f766e;
            color: white;
            padding: 25px;
            text-align: center;
        }

        main {
            max-width: 1300px;
            margin: 30px auto;
            padding: 20px;
        }

        .summary {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px #00000010;
        }

        .summary h2 {
            margin-top: 0;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #e2e8f0;
        }

        .status {
            font-weight: bold;
        }

        select {
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            background: white;
            color: #1e293b;
            cursor: pointer;
        }

        select:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        button {
            background: #0f766e;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #115e59;
        }

        #message {
            margin: 15px 0;
        }

        .counts {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Smart City Complaint Management System</h1>
        <p>Public Complaint Dashboard</p>
    </header>

    <main>

        <section class="summary">
            <h2>Complaint Overview</h2>

            <div class="counts">
                <p>Total Complaints: <strong id="total">0</strong></p>
                <p>Pending: <strong id="pending">0</strong></p>
                <p>In Progress: <strong id="progress">0</strong></p>
                <p>Resolved: <strong id="resolved">0</strong></p>
            </div>

            <button id="refreshButton" onclick="loadComplaints()">
                Refresh Complaints
            </button>
        </section>

        <section class="table-container">
            <h2>All Complaints</h2>

            <p id="message" role="status" aria-live="polite">
                Loading complaints...
            </p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Citizen</th>
                        <th>Category</th>
                        <th>Zone</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody id="complaintTable"></tbody>
            </table>
        </section>

    </main>

    <script>
        async function loadComplaints() {
            const message = document.getElementById("message");
            const table = document.getElementById("complaintTable");
            const refreshButton = document.getElementById("refreshButton");

            message.textContent = "Loading complaints...";
            table.replaceChildren();
            refreshButton.disabled = true;

            try {
                const response = await fetch("/api/complaints");

                if (!response.ok) {
                    throw new Error("Could not load complaints.");
                }

                const complaints = await response.json();

                if (!Array.isArray(complaints)) {
                    throw new Error("Invalid complaint data received.");
                }

                let pending = 0;
                let progress = 0;
                let resolved = 0;

                complaints.forEach(function (complaint) {

                    // Count complaints by status
                    if (complaint.status === "Pending") {
                        pending++;
                    } else if (complaint.status === "In Progress") {
                        progress++;
                    } else if (complaint.status === "Resolved") {
                        resolved++;
                    }

                    const row = document.createElement("tr");

                    // Complaint details before status
                    const values = [
                        complaint.complaint_id,
                        complaint.citizen_name,
                        complaint.category_name,
                        complaint.zone_name,
                        complaint.description
                    ];

                    values.forEach(function (value) {
                        const cell = document.createElement("td");
                        cell.textContent = value ?? "-";
                        row.appendChild(cell);
                    });

                    // Status dropdown
                    const statusCell = document.createElement("td");
                    statusCell.className = "status";

                    const statusSelect = document.createElement("select");
                    statusSelect.setAttribute(
                        "aria-label",
                        "Status for complaint " + complaint.complaint_id
                    );

                    const allowedStatuses = [
                        "Pending",
                        "In Progress",
                        "Resolved"
                    ];

                    allowedStatuses.forEach(function (status) {
                        const option = document.createElement("option");
                        option.value = status;
                        option.textContent = status;

                        if (status === complaint.status) {
                            option.selected = true;
                        }

                        statusSelect.appendChild(option);
                    });

                    statusSelect.addEventListener("change", async function () {
                        const newStatus = statusSelect.value;

                        statusSelect.disabled = true;
                        message.textContent =
                            "Updating complaint #" +
                            complaint.complaint_id + "...";

                        try {
                            const updateResponse = await fetch(
                                "/api/complaints/" +
                                complaint.complaint_id + "/status",
                                {
                                    method: "PUT",
                                    headers: {
                                        "Content-Type": "application/json"
                                    },
                                    body: JSON.stringify({
                                        status: newStatus
                                    })
                                }
                            );

                            if (!updateResponse.ok) {
                                let errorMessage = "Status update failed.";

                                try {
                                    const errorData =
                                        await updateResponse.json();

                                    errorMessage =
                                        errorData.detail ||
                                        errorData.message ||
                                        errorData.error ||
                                        errorMessage;
                                } catch (ignored) {
                                    // Keep the default error message.
                                }

                                throw new Error(errorMessage);
                            }

                            message.textContent =
                                "Complaint #" +
                                complaint.complaint_id +
                                " updated successfully.";

                            // Reload table and summary counts
                            await loadComplaints();

                        } catch (error) {
                            message.textContent =
                                "Could not update status: " + error.message;

                            // Restore the saved status from the server
                            await loadComplaints();

                        } finally {
                            statusSelect.disabled = false;
                        }
                    });

                    statusCell.appendChild(statusSelect);
                    row.appendChild(statusCell);

                    // Priority
                    const priorityCell = document.createElement("td");
                    priorityCell.textContent = complaint.priority ?? "-";
                    row.appendChild(priorityCell);

                    // Complaint date
                    const dateCell = document.createElement("td");
                    dateCell.textContent = complaint.complaint_date ?? "-";
                    row.appendChild(dateCell);

                    table.appendChild(row);
                });

                // Update dashboard totals
                document.getElementById("total").textContent =
                    complaints.length;

                document.getElementById("pending").textContent = pending;
                document.getElementById("progress").textContent = progress;
                document.getElementById("resolved").textContent = resolved;

                if (complaints.length === 0) {
                    message.textContent = "No complaints found.";
                } else if (message.textContent === "Loading complaints...") {
                    message.textContent = "Complaints loaded successfully.";
                } else if (!message.textContent.startsWith("Complaint #")) {
                    message.textContent = "Complaints loaded successfully.";
                }

            } catch (error) {
                message.textContent =
                    "Unable to load complaints. " + error.message;

                console.error("Error loading complaints:", error);

            } finally {
                refreshButton.disabled = false;
            }
        }

        // Load complaints when the page opens
        window.addEventListener("DOMContentLoaded", loadComplaints);
    </script>

</body>
</html>
